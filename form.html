<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration - Campus Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Campus Events</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="form.html">Join / Register</a>
    </nav>
  </header>

  <main class="form-container">
    <h1>Register for an Event</h1>
    <form action="#" method="POST">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>

      <div class="form-group">
        <label for="email">Student Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="eventSelect">Select Event</label>
        <select id="eventSelect" name="eventSelect" required>
          <option value="">-- Choose an event --</option>
          <option value="web-dev">Web Dev Workshop</option>
          <option value="gaming">Gaming Night</option>
          <option value="career">Career & Internship Talk</option>
          <option value="ai">AI & Cloud Meetup</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tickets">Number of Seats</label>
        <input type="number" id="tickets" name="tickets" min="1" max="5" value="1" required>
      </div>

      <button type="submit">Submit Registration</button>
      <p id="form-error" class="error-msg"></p>
      <p id="form-success" class="success-msg"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Campus Club Hub. All rights reserved.</p>
  </footer>
<script src="app.js"></script>
</body>
</html>
